[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "agentcapdiff"
version = "1.0.1"
description = "AI agent security policy-as-code for capability diffing, least-privilege review, and CI enforcement."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "nqtplus" }]
keywords = [
  "ai-agents",
  "ai-agent-security",
  "agent-security",
  "security",
  "mcp",
  "openai-agents",
  "langchain",
  "langgraph",
  "crewai",
  "policy-as-code",
  "least-privilege",
  "capability-diff",
  "sarif",
  "github-actions",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
]
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.4"]

[project.scripts]
agentcapdiff = "agentcapdiff.cli:main"

[project.urls]
Homepage = "https://github.com/nqtplus/agentcapdiff"
Repository = "https://github.com/nqtplus/agentcapdiff"
Issues = "https://github.com/nqtplus/agentcapdiff/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcapdiff"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E501"]
