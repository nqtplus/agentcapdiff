[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentcapdiff"
version = "0.5.0"
description = "Policy-as-code and capability diffing for AI agents and tool-enabled applications."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "nqtplus" }]
keywords = ["ai-agents", "security", "mcp", "policy-as-code", "github-actions", "least-privilege"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
]
dependencies = ["PyYAML>=6.0.2"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.9"]

[project.scripts]
agentcapdiff = "agentcapdiff.cli:main"

[project.urls]
Homepage = "https://github.com/nqtplus/agentcapdiff"
Repository = "https://github.com/nqtplus/agentcapdiff"
Issues = "https://github.com/nqtplus/agentcapdiff/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcapdiff"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E501"]
