version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Ho_Chi_Minh"
    # The repository uses a reviewed multi-manifest, hash-locked closure.
    # Keep automated security updates, but require coordinated human-reviewed
    # PRs for routine Python version refreshes.
    open-pull-requests-limit: 0
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "actions/checkout"
      - dependency-name: "actions/setup-python"
      - dependency-name: "actions/attest"
      - dependency-name: "github/codeql-action"
    labels:
      - "dependencies"
