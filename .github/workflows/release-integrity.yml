name: Release integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
      - name: Materialize trusted base control plane
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git worktree add --detach ../agentcapdiff-trusted-base "$BASE_SHA"
      - name: Verify runner provenance from trusted source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          CHECKER="scripts/check_ci_environment.py"
          ARGS=(--python-version "3.12.14" --pip-version "26.2.1")
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python "../agentcapdiff-trusted-base/$CHECKER" "${ARGS[@]}"
          else
            python "$CHECKER" "${ARGS[@]}"
          fi
      - run: "python -m pip --isolated --disable-pip-version-check install --require-hashes --no-deps --no-cache-dir --only-binary=:all: --index-url=https://pypi.org/simple -r requirements/ci-lock.txt"
      - run: python -m pip check
      - name: Verify workflow/dependency/release invariants from trusted control plane
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python ../agentcapdiff-trusted-base/scripts/check_release_integrity.py --root "$GITHUB_WORKSPACE"
          else
            python scripts/check_release_integrity.py --root "$GITHUB_WORKSPACE"
          fi
      - name: Verify attestation identity/binding invariants from trusted control plane
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python ../agentcapdiff-trusted-base/scripts/check_attestation_integrity.py --root "$GITHUB_WORKSPACE"
          else
            python scripts/check_attestation_integrity.py --root "$GITHUB_WORKSPACE"
          fi
      - name: Verify release retry/idempotency invariants from trusted control plane
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python ../agentcapdiff-trusted-base/scripts/check_release_transaction_integrity.py --root "$GITHUB_WORKSPACE"
          else
            python scripts/check_release_transaction_integrity.py --root "$GITHUB_WORKSPACE"
          fi
      - name: Verify Actions trust-boundary invariants
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" && -f ../agentcapdiff-trusted-base/scripts/check_actions_trust_boundaries.py ]]; then
            python ../agentcapdiff-trusted-base/scripts/check_actions_trust_boundaries.py --root "$GITHUB_WORKSPACE"
          else
            python scripts/check_actions_trust_boundaries.py --root "$GITHUB_WORKSPACE"
          fi
      - name: Verify dependency-update integrity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          CHECKER="scripts/check_dependency_update_integrity.py"
          if [[ "$EVENT_NAME" == "pull_request" && -f "../agentcapdiff-trusted-base/$CHECKER" ]]; then
            CHECKER="../agentcapdiff-trusted-base/$CHECKER"
          fi
          python "$CHECKER" --root "$GITHUB_WORKSPACE"
      - name: Build release artifacts without floating build dependencies
        run: python -m build --no-isolation
      - name: Generate and validate SPDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python scripts/generate_sbom.py \
            --dist-dir dist \
            --output "$RUNNER_TEMP/agentcapdiff.spdx.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "agentcapdiff.spdx.json"
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["spdxVersion"] == "SPDX-2.3"
          assert payload["files"], "SBOM must contain built artifacts"
          assert payload["packages"], "SBOM must contain package records"
          print("SPDX SBOM smoke check passed")
          PY
