name: Project state consistency

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  state:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize trusted base control plane
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git worktree add --detach ../agentcapdiff-trusted-base "$BASE_SHA"
      - name: Verify runner provenance from trusted source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          CHECKER="scripts/check_ci_environment.py"
          ARGS=(--python-version "3.12.3" --pip-version "24.0")
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python3 "../agentcapdiff-trusted-base/$CHECKER" "${ARGS[@]}"
          else
            python3 "$CHECKER" "${ARGS[@]}"
          fi
      - name: Verify dependency-update integrity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CHECKER="scripts/check_dependency_update_integrity.py"
          TRUSTED_CHECKER="../agentcapdiff-trusted-base/scripts/check_dependency_update_integrity.py"
          if [[ "$EVENT_NAME" == "pull_request" && -f "$TRUSTED_CHECKER" ]]; then
            CHECKER="$TRUSTED_CHECKER"
          fi
          ARGS=(--root "$GITHUB_WORKSPACE")
          if [[ "$EVENT_NAME" == "pull_request" && "$IS_DEPENDABOT" == "true" ]]; then
            ARGS+=(--base-sha "$BASE_SHA" --head-sha "$HEAD_SHA")
          fi
          python "$CHECKER" "${ARGS[@]}"
      - name: Verify roadmap and version metadata
        shell: python
        run: |
          from pathlib import Path
          import re

          roadmap = Path("ROADMAP.md").read_text(encoding="utf-8")
          pyproject = Path("pyproject.toml").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          init = Path("src/agentcapdiff/__init__.py").read_text(encoding="utf-8")

          package_match = re.search(r'^version = "([^"]+)"$', pyproject, re.M)
          runtime_match = re.search(r'^__version__ = "([^"]+)"$', init, re.M)
          if not package_match or not runtime_match:
              raise SystemExit("version metadata missing")
          version = package_match.group(1)
          if runtime_match.group(1) != version:
              raise SystemExit("pyproject/runtime version mismatch")

          sections = re.findall(
              r"## (v\d+\.\d+) — ([^\n]+)(.*?)(?=\n## v\d+\.\d+|\n## What|\Z)",
              roadmap,
              re.S,
          )
          if not sections:
              raise SystemExit("ROADMAP.md has no version sections")

          incomplete = []
          section_titles = {}
          for label, title, body in sections:
              section_titles[label] = title
              if "- [ ]" in body:
                  incomplete.append(label)

          target_match = re.search(r"Status:\s*\*\*(v\d+\.\d+)[^*]*IN_PROGRESS", readme)
          if target_match:
              target = target_match.group(1)
              expected_prefix = target.removeprefix("v") + ".0"
              if not version.startswith(expected_prefix) or not version.endswith(".dev0"):
                  raise SystemExit(
                      f"README targets {target} IN_PROGRESS but version is {version}; "
                      f"expected {expected_prefix}.dev0"
                  )
              if target not in incomplete:
                  raise SystemExit(
                      f"README marks {target} IN_PROGRESS but roadmap has no unchecked item"
                  )
          else:
              final_match = re.search(
                  r"Status:\s*\*\*(v\d+\.\d+)\.0[^*]*complete",
                  readme,
                  re.I,
              )
              if final_match:
                  final_target = final_match.group(1)
                  expected = final_target.removeprefix("v") + ".0"
                  if version != expected:
                      raise SystemExit(
                          f"README marks {final_target} complete but package version is {version}"
                      )
                  if final_target in incomplete:
                      raise SystemExit(
                          f"README marks {final_target} complete but ROADMAP.md still has unchecked items"
                      )
                  if "✅" not in section_titles.get(final_target, ""):
                      raise SystemExit(
                          f"README marks {final_target} complete but roadmap heading lacks completion marker"
                      )
                  if f"## [{version}]" not in changelog:
                      raise SystemExit(
                          f"README marks {final_target} complete but CHANGELOG.md lacks [{version}]"
                      )

          print(f"project state metadata consistent: version={version}")
      - name: Verify supply-chain integrity invariants from trusted control plane
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            python ../agentcapdiff-trusted-base/scripts/check_release_integrity.py --root "$GITHUB_WORKSPACE"
          else
            python scripts/check_release_integrity.py --root "$GITHUB_WORKSPACE"
          fi
      - name: Verify Actions trust-boundary invariants
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" && -f ../agentcapdiff-trusted-base/scripts/check_actions_trust_boundaries.py ]]; then
            python ../agentcapdiff-trusted-base/scripts/check_actions_trust_boundaries.py --root "$GITHUB_WORKSPACE"
          else
            python scripts/check_actions_trust_boundaries.py --root "$GITHUB_WORKSPACE"
          fi
