name: PR capability diff
on:
  pull_request:
permissions:
  contents: read
jobs:
  capability-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --no-deps --no-cache-dir --only-binary=:all: -r requirements/ci-lock.txt
      - run: python -m pip check
      - run: python -m pip install . --no-deps --no-build-isolation
      - name: Snapshot base and head
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          BASE_DIR="$RUNNER_TEMP/agentcapdiff-base"
          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          agentcapdiff snapshot "$BASE_DIR" \
            --policy "$BASE_DIR/agentcapdiff.yaml" \
            --output "$RUNNER_TEMP/base.json"
          agentcapdiff snapshot . \
            --policy agentcapdiff.yaml \
            --output "$RUNNER_TEMP/head.json"
      - name: Render capability diff
        shell: bash
        run: |
          set -euo pipefail
          agentcapdiff diff \
            "$RUNNER_TEMP/base.json" \
            "$RUNNER_TEMP/head.json" \
            --format markdown \
            --output "$RUNNER_TEMP/capability-diff.md"
          cat "$RUNNER_TEMP/capability-diff.md" >> "$GITHUB_STEP_SUMMARY"
