name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements/ci-direct.txt
      - run: python -m pip install . --no-deps --no-build-isolation
      - run: ruff check .
      - run: pytest --cov=agentcapdiff --cov-report=term-missing
      - name: Safety benchmark regression gate
        run: python -m agentcapdiff.benchmark --output benchmark-summary.json
      - name: Release integrity regression gate
        run: python scripts/check_release_integrity.py
      - run: agentcapdiff scan examples --policy agentcapdiff.yaml --fail-on never
