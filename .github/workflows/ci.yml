name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11.16", "3.12.14", "3.13.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/check_ci_environment.py --python-version "${{ matrix.python-version }}"
      - run: "python -m pip --isolated --disable-pip-version-check install --require-hashes --no-deps --no-cache-dir --only-binary=:all: --index-url=https://pypi.org/simple -r requirements/ci-lock.txt"
      - run: python -m pip check
      - run: python -m pip install . --no-deps --no-build-isolation
      - run: ruff check .
      - run: pytest --cov=agentcapdiff --cov-report=term-missing
      - name: Safety benchmark regression gate
        run: python -m agentcapdiff.benchmark --output benchmark-summary.json
      - name: Release integrity regression gate
        run: python scripts/check_release_integrity.py
      - run: agentcapdiff scan examples --policy agentcapdiff.yaml --fail-on never
