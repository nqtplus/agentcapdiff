name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11.16", "3.12.14", "3.13.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/check_ci_environment.py --python-version "${{ matrix.python-version }}" --pip-version "26.2.1"
      - name: Require tagged commit to be on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: "python -m pip --isolated --disable-pip-version-check install --require-hashes --no-deps --no-cache-dir --only-binary=:all: --index-url=https://pypi.org/simple -r requirements/ci-lock.txt"
      - run: python -m pip check
      - run: python -m pip install . --no-deps --no-build-isolation
      - name: Verify release tag and integrity contract
        run: python scripts/check_release_integrity.py --release-tag "$GITHUB_REF_NAME"
      - name: Verify release attestation identity contract
        run: python scripts/check_attestation_integrity.py
      - run: ruff check .
      - run: pytest --cov=agentcapdiff --cov-report=term-missing
      - name: Safety benchmark release gate
        if: matrix.python-version == '3.12.14'
        run: python -m agentcapdiff.benchmark --output benchmark-summary.json
      - name: AgentCapDiff self-policy release gate
        if: matrix.python-version == '3.12.14'
        run: agentcapdiff scan . --policy agentcapdiff.yaml --fail-on never

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 scripts/check_ci_environment.py --python-version "3.12.3" --pip-version "24.0"
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4

  publish:
    needs: [validate, codeql]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
      - run: python scripts/check_ci_environment.py --python-version "3.12.14" --pip-version "26.2.1"
      - run: "python -m pip --isolated --disable-pip-version-check install --require-hashes --no-deps --no-cache-dir --only-binary=:all: --index-url=https://pypi.org/simple -r requirements/ci-lock.txt"
      - run: python -m pip check
      - name: Require repository release immutability before building
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          enabled="$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled)"
          if [[ "$enabled" != "true" ]]; then
            echo "::error::Enable GitHub release immutability before publishing a production tag."
            exit 1
          fi
      - name: Reset release artifact directories
        shell: bash
        run: |
          set -euo pipefail
          rm -rf -- dist release
          mkdir -- dist release
      - name: Build reviewed source and wheel artifacts
        run: python -m build --no-isolation --outdir dist
      - name: Generate validated SPDX SBOM and checksums
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python scripts/generate_sbom.py \
            --dist-dir dist \
            --output release/agentcapdiff.spdx.json \
            --checksums-output release/SHA256SUMS
      - name: Attest build provenance from validated checksums
        id: attest_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: release/SHA256SUMS
      - name: Attest SPDX SBOM from validated checksums
        id: attest_sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: release/SHA256SUMS
          sbom-path: "release/agentcapdiff.spdx.json"
      - name: Verify signed subject, source, signer, and SBOM binding
        env:
          PROVENANCE_BUNDLE: ${{ steps.attest_provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.attest_sbom.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_release_attestations.py \
            --tag "$GITHUB_REF_NAME" \
            --source-sha "$GITHUB_SHA" \
            --dist-dir dist \
            --checksums release/SHA256SUMS \
            --sbom release/agentcapdiff.spdx.json \
            --provenance-bundle "$PROVENANCE_BUNDLE" \
            --sbom-bundle "$SBOM_BUNDLE"
      - name: Create draft release with exact validated assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/agentcapdiff-${version}-py3-none-any.whl" \
            "dist/agentcapdiff-${version}.tar.gz" \
            release/agentcapdiff.spdx.json \
            release/SHA256SUMS \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
      - name: Publish and require GitHub immutable release protection
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" --draft=false
          immutable="$(gh release view "$GITHUB_REF_NAME" --json isImmutable --jq .isImmutable)"
          if [[ "$immutable" != "true" ]]; then
            echo "::error::GitHub did not mark the published release immutable."
            gh release delete "$GITHUB_REF_NAME" --cleanup-tag --yes
            exit 1
          fi
