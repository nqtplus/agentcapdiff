name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Require tagged commit to be on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: python -m pip install -r requirements/ci-direct.txt
      - run: python -m pip install -e . --no-deps --no-build-isolation
      - name: Verify release tag and integrity contract
        run: python scripts/check_release_integrity.py --release-tag "$GITHUB_REF_NAME"
      - run: ruff check .
      - run: pytest --cov=agentcapdiff --cov-report=term-missing
      - name: Safety benchmark release gate
        if: matrix.python-version == '3.12'
        run: python -m agentcapdiff.benchmark --output benchmark-summary.json
      - name: AgentCapDiff self-policy release gate
        if: matrix.python-version == '3.12'
        run: agentcapdiff scan . --policy agentcapdiff.yaml --fail-on never

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4

  publish:
    needs: [validate, codeql]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements/ci-direct.txt
      - name: Build reviewed source and wheel artifacts
        run: python -m build --no-isolation
      - name: Generate SPDX SBOM and checksums
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          mkdir -p release
          python scripts/generate_sbom.py \
            --dist-dir dist \
            --output release/agentcapdiff.spdx.json
          sha256sum dist/* > release/SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "dist/*"
      - name: Attest SPDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "dist/*"
          sbom-path: "release/agentcapdiff.spdx.json"
      - name: Create draft release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* release/* \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
      - name: Publish and require GitHub immutable release protection
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" --draft=false
          immutable="$(gh release view "$GITHUB_REF_NAME" --json isImmutable --jq .isImmutable)"
          if [[ "$immutable" != "true" ]]; then
            echo "::error::GitHub release immutability is not enabled; removing mutable release/tag."
            gh release delete "$GITHUB_REF_NAME" --cleanup-tag --yes || true
            exit 1
          fi
