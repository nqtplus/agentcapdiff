name: Agent capability policy
on:
  pull_request:
permissions:
  contents: read
  security-events: write
jobs:
  capability-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.14"
      - run: python scripts/check_ci_environment.py --python-version "3.12.14" --pip-version "26.2.1"
      - run: "python -m pip --isolated --disable-pip-version-check install --require-hashes --no-deps --no-cache-dir --only-binary=:all: --index-url=https://pypi.org/simple -r requirements/ci-lock.txt"
      - run: python -m pip check
      - run: python -m pip install . --no-deps --no-build-isolation
      - run: agentcapdiff scan . --policy agentcapdiff.yaml --format sarif --output agentcapdiff.sarif --fail-on never
      - uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          sarif_file: agentcapdiff.sarif
